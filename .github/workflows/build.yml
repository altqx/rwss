name: Build and Release

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_changed: ${{ steps.compare_versions.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          JSR_VERSION=$(node -p "require('./jsr.json').version")

          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$JSR_VERSION" ]; then
            echo "Version mismatch: package.json=$VERSION Cargo.toml=$CARGO_VERSION jsr.json=$JSR_VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version has changed
        id: compare_versions
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ "$LATEST_TAG" = "none" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "First release: $CURRENT_VERSION"
          else
            LATEST_VERSION=${LATEST_TAG#v}
            if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Version unchanged: $CURRENT_VERSION"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Version bumped from $LATEST_VERSION to $CURRENT_VERSION"
            fi
          fi

  build:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack

      - name: Install e2e fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM and TypeScript
        run: bun run build

      - name: Run Rust tests
        run: bun run test:rust

      - name: Typecheck
        run: bun run typecheck

      - name: Run TypeScript tests
        run: bun run test:ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwss-dist
          path: |
            dist/
            pkg/

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rwss-dist
          path: .

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Missing CARGO_TOKEN secret on the release environment" >&2
            exit 1
          fi

          # Keep the lockfile in sync before publish so cargo does not dirty
          # Cargo.lock mid-job (publish rejects uncommitted changes by default).
          cargo metadata --format-version 1 --locked >/dev/null

          version=$(node -p "require('./package.json').version")
          if curl -fsS -A "rwss-ci" -o /dev/null "https://crates.io/api/v1/crates/rwss/${version}"; then
            echo "rwss v${version} is already published"
          else
            cargo publish --locked
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Publish to JSR
        run: |
          jsr_name=$(node -p "require('./jsr.json').name")
          jsr_version=$(node -p "require('./jsr.json').version")
          jsr_path=${jsr_name#@}

          if curl -fsS -A "rwss-ci" -o /dev/null "https://jsr.io/@${jsr_path}/${jsr_version}_meta.json" 2>/dev/null; then
            echo "${jsr_name} v${jsr_version} is already available on JSR; skipping publish"
          else
            deno publish --no-check --allow-dirty
          fi

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Missing NPM_TOKEN secret on the release environment" >&2
            exit 1
          fi

          # wasm-pack writes pkg/.gitignore as "*", which would empty the
          # published WASM package even though package.json lists pkg/.
          rm -f pkg/.gitignore

          npm_version=$(node -p "require('./package.json').version")
          if npm view "rwss@${npm_version}" version >/dev/null 2>&1; then
            echo "rwss@${npm_version} is already on npm; skipping publish"
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## rwss v${{ needs.check-version.outputs.version }}

            ### Installation

            **npm / bun**
            ```bash
            npm install rwss
            # or
            bun add rwss
            ```

            **JSR (Deno)**
            ```bash
            deno add jsr:@altq/rwss
            ```

            **crates.io**
            ```bash
            cargo add rwss
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
