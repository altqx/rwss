[package]
name = "rwss"
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
authors = ["altqx"]
license = "MIT"
description = "Web browser ASS/SSA renderer wrapper around the pure-Rust rassa renderer"
readme = "README.md"
repository = "https://github.com/altqx/rwss"
keywords = ["ass", "ssa", "subtitle", "wasm", "rassa"]
categories = ["multimedia::video", "wasm"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/default.woff2",
    "/src/lib.rs",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
rassa = "0.7.1"
rassa-fonts = "0.7.1"
rassa-shape = "0.7.1"
ttf-parser = "0.25"
wasm-bindgen = "0.2.127"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1.7", optional = true }
wuff = "0.2.8"

[dev-dependencies]
wasm-bindgen-test = "0.3.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]
